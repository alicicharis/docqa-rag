[project]
name = "docqa-rag"
version = "0.1.0"
description = "Question answering over local markdown documents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "chromadb>=1,<2",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
]

[project.scripts]
docqa = "docqa_rag.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
